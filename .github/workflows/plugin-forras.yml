name: Plugin forrás kiírása (egyszeri)

# Indítás: GitHub → Actions → "Plugin forrás kiírása (egyszeri)" → Run workflow
# A kész futásnál az "Artifacts" részen letölthető a plugin két Java fájlja (plugin-forras.zip).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Fájlok összegyűjtése
        run: |
          SRC=node_modules/@capacitor-community/background-geolocation/android/src/main/java/com/equimaps/capacitor_background_geolocation
          mkdir -p out
          cp "$SRC/BackgroundGeolocationService.java" "$SRC/BackgroundGeolocation.java" out/
          grep '"version"' node_modules/@capacitor-community/background-geolocation/package.json > out/verzio.txt
          cat out/verzio.txt

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-forras
          path: out/
