name: Private Place – APK és IPA építése

# Indítás: GitHub → Actions → "Private Place – APK és IPA építése" → Run workflow
on:
  workflow_dispatch:
    inputs:
      public_url:
        description: "A közzétett weboldal címe a meghívó linkekhez. Üresen hagyva a PUBLIC_APP_URL repository változó értéke számít (GitHub → Settings → Secrets and variables → Actions → Variables); ha az sincs, csak kód és QR-kód"
        required: false
        default: ""

# Alapból csak olvasás; írási jog csak a kiadást készítő lépésnek van.
permissions:
  contents: read

jobs:
  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
      version: ${{ steps.s.outputs.version }}
      title: ${{ steps.s.outputs.title }}
    steps:
      - id: s
        run: |
          echo "stamp=$(TZ=Europe/Budapest date +%Y-%m-%d_%H%M)" >> "$GITHUB_OUTPUT"
          echo "version=$(TZ=Europe/Budapest date +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "title=Private Place $(TZ=Europe/Budapest date '+%Y.%m.%d. %H:%M') (#${{ github.run_number }})" >> "$GITHUB_OUTPUT"

  android:
    needs: stamp
    runs-on: ubuntu-latest
    env:
      BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
      APP_VERSION_NAME: ${{ needs.stamp.outputs.version }}
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK előkészítése
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi

      - run: bun install --frozen-lockfile

      - name: Webes felület (statikus) építése
        env:
          VITE_PUBLIC_APP_URL: ${{ inputs.public_url || vars.PUBLIC_APP_URL }}
          VITE_RELEASE_REPOSITORY: ${{ github.repository }}
          VITE_APP_VERSION_CODE: ${{ github.run_number }}
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: VITE_APP_VERSION="$APP_VERSION_NAME" bun run build:app

      - name: Android projekt előkészítése (engedélyek, ikon, indítókép, verzió)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/patch-android.mjs
          npx cap sync android
          node scripts/patch-background.mjs

      - name: APK fordítása és aláírása
        working-directory: android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          mkdir -p ../out
          # A kulcsfájl elsődlegesen a titokból áll vissza; átmenetként a régi signing/ fájl a tartalék.
          KS_FILE="$GITHUB_WORKSPACE/signing/private-place.keystore"
          if [ -n "$KS_BASE64" ]; then
            KS_FILE="$RUNNER_TEMP/private-place.keystore"
            printf '%s' "$KS_BASE64" | base64 -d > "$KS_FILE"
          fi
          if [ -n "$KS_PASSWORD" ] && [ -f "$KS_FILE" ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$KS_FILE" \
              -Pandroid.injected.signing.store.password="$KS_PASSWORD" \
              -Pandroid.injected.signing.key.alias=privateplace \
              -Pandroid.injected.signing.key.password="$KS_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "../out/private-place-${BUILD_STAMP}.apk"
          else
            echo "::warning::Hiányzik az ANDROID_KEYSTORE_PASSWORD titok vagy a kulcsfájl – teszt aláírással készül."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../out/private-place-${BUILD_STAMP}-teszt.apk"
          fi

      # Csak tájékoztató: soha nem állítja le a mentést.
      - name: Aláírás ellenőrzése
        continue-on-error: true
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs out/*.apk || true; fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*
          if-no-files-found: error

  ios:
    needs: stamp
    runs-on: macos-latest
    env:
      APP_VERSION_NAME: ${{ needs.stamp.outputs.version }}
      APP_VERSION_CODE: ${{ github.run_number }}
      BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Webes felület (statikus) építése
        env:
          VITE_PUBLIC_APP_URL: ${{ inputs.public_url || vars.PUBLIC_APP_URL }}
          VITE_RELEASE_REPOSITORY: ${{ github.repository }}
          VITE_APP_VERSION_CODE: ${{ github.run_number }}
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: VITE_APP_VERSION="$APP_VERSION_NAME" bun run build:app

      - name: iOS projekt előkészítése
        run: |
          if [ ! -d ios ]; then npx cap add ios --packagemanager CocoaPods; fi
          node scripts/patch-ios.mjs
          npx cap sync ios

      - name: IPA fordítása (aláírás nélkül, oldalról telepítéshez)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)
          test -d "$APP"
          mkdir -p Payload ../../out
          cp -R "$APP" Payload/
          zip -qry "../../out/private-place-${BUILD_STAMP}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: out/*.ipa
          if-no-files-found: error

  release:
    needs: [stamp, android, ios]
    if: ${{ always() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Legújabb telepítő és verzióadatok
        run: |
          APK=$(ls out/*.apk 2>/dev/null | head -n1)
          if [ -n "$APK" ]; then
            cp "$APK" out/private-place-latest.apk
            printf '{"versionCode":%s,"version":"%s"}\n' '${{ github.run_number }}' '${{ needs.stamp.outputs.version }}' > out/private-place-release.json
          fi
      - name: Kiadás (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ needs.stamp.outputs.stamp }}-${{ github.run_number }}
          name: ${{ needs.stamp.outputs.title }}
          body: |
            Verzió: ${{ needs.stamp.outputs.version }} (#${{ github.run_number }})
            Android: ${{ needs.android.result == 'success' && 'kész (.apk)' || 'nem sikerült' }} · iPhone: ${{ needs.ios.result == 'success' && 'kész (.ipa)' || 'nem sikerült' }}

            Android: töltsd le az .apk fájlt a telefonra és telepítsd (ismeretlen forrás engedélyezése kell).
            iPhone: az .ipa aláírás nélküli; Sideloadly vagy AltStore segítségével, a saját Apple ID-ddel telepíthető.
          files: out/*
