name: Private Place – natív APK és IPA építése

# Indítás: GitHub → Actions → "Private Place – natív APK és IPA építése" → Run workflow
on:
  workflow_dispatch:

# Alapból csak olvasás; írási jog csak a kiadást készítő lépésnek van.
permissions:
  contents: read

jobs:
  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
      version: ${{ steps.s.outputs.version }}
      marketing: ${{ steps.s.outputs.marketing }}
      code: ${{ steps.s.outputs.code }}
      title: ${{ steps.s.outputs.title }}
    steps:
      - id: s
        run: |
          # Dátumjelző (budapesti idő): fájlnevekben, verzióban, kiadáscímkében.
          # A versionCode = futás sorszáma + eltolás. Az eltolás (Settings → Variables → VERSION_CODE_OFFSET) kell, ha az új natív app
          # egy korábbi (Capacitor) app fölé települ: Android nem enged alacsonyabb versionCode-ra frissíteni.
          CODE=$(( ${{ github.run_number }} + ${{ vars.VERSION_CODE_OFFSET || 0 }} ))
          echo "stamp=$(TZ=Europe/Budapest date +%Y-%m-%d_%H%M)" >> "$GITHUB_OUTPUT"
          echo "version=$(TZ=Europe/Budapest date +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "marketing=$(TZ=Europe/Budapest date +%Y.%-m.%-d)" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "title=Private Place $(TZ=Europe/Budapest date '+%Y.%m.%d. %H:%M') (#$CODE)" >> "$GITHUB_OUTPUT"

  # Egységtesztek (a kiadást nem blokkolják, de látszik az eredmény)
  tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest

  android:
    needs: stamp
    runs-on: ubuntu-latest
    env:
      BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
      APP_VERSION_NAME: ${{ needs.stamp.outputs.version }}
      APP_VERSION_CODE: ${{ needs.stamp.outputs.code }}
      TURN_URLS: ${{ secrets.TURN_URLS }}
      TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
      TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: APK fordítása és aláírása
        working-directory: android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ../out
          # Ideiglenes (teszt) aláírású APK-t soha nem adunk ki: másik kulccsal aláírt APK nem települ a meglévő app fölé.
          if [ -z "$KS_PASSWORD" ] || [ -z "$KS_BASE64" ]; then
            echo "::error::Hiányzik az ANDROID_KEYSTORE_PASSWORD / ANDROID_KEYSTORE_BASE64 titok – APK nem készül."
            exit 1
          fi
          KS_FILE="$RUNNER_TEMP/private-place.keystore"
          printf '%s' "$KS_BASE64" | base64 -d > "$KS_FILE"
          export KS_FILE KS_PASSWORD
          echo "KS_FILE=$KS_FILE" >> "$GITHUB_ENV"
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../out/private-place-${BUILD_STAMP}.apk"

      # Az APK-t az állandó kulccsal kell aláírni, különben az appon belüli (OTA) frissítés nem települ fel.
      - name: Aláírás ellenőrzése (az állandó kulccsal egyezik-e)
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose out/*.apk
          "$APKSIGNER" verify --print-certs out/*.apk > "$RUNNER_TEMP/apk-certs.txt"
          ACTUAL=$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certs.txt" | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(keytool -exportcert -keystore "$KS_FILE" -storepass:env KS_PASSWORD -alias privateplace | sha256sum | cut -d ' ' -f 1)
          echo "APK tanúsítvány SHA-256: $ACTUAL"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Aláírókulcs törlése a futtatóról
        if: always()
        run: rm -f "$RUNNER_TEMP/private-place.keystore"

      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: out/*, if-no-files-found: error }

  ios:
    needs: stamp
    runs-on: macos-14
    env:
      BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode projekt generálása
        working-directory: ios
        run: brew install xcodegen && xcodegen generate

      # Az IPA aláírás nélküli (oldalról telepíthető: Sideloadly / AltStore a saját Apple ID-vel), ahogy eddig is.
      - name: IPA fordítása
        working-directory: ios
        run: |
          xcodebuild -project PrivatePlace.xcodeproj -scheme PrivatePlace -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="${{ needs.stamp.outputs.marketing }}" CURRENT_PROJECT_VERSION="${{ needs.stamp.outputs.code }}" \
            TURN_URLS="${{ secrets.TURN_URLS }}" TURN_USERNAME="${{ secrets.TURN_USERNAME }}" TURN_CREDENTIAL="${{ secrets.TURN_CREDENTIAL }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n1)
          test -d "$APP"
          mkdir -p Payload ../out
          cp -R "$APP" Payload/
          zip -qry "../out/private-place-${BUILD_STAMP}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with: { name: ios-ipa, path: out/*.ipa, if-no-files-found: error }

  release:
    needs: [stamp, android, ios]
    # Csak sikeres Android build után: egy APK nélküli, újabb kiadás elrejtené a legutóbbi telepíthető APK-t az OTA-frissítés elől.
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Verzióadatok
        run: |
          printf '{"versionCode":%s,"version":"%s"}\n' '${{ needs.stamp.outputs.code }}' '${{ needs.stamp.outputs.version }}' > out/private-place-release.json
      - name: Kiadás (Releases)
        uses: softprops/action-gh-release@v2
        with:
          # A címke a versionCode-dal végződik (build-2026-11-11_1530-42): az OTA-frissítő ebből ismeri fel az újabb verziót.
          tag_name: build-${{ needs.stamp.outputs.stamp }}-${{ needs.stamp.outputs.code }}
          name: ${{ needs.stamp.outputs.title }}
          body: |
            Verzió: ${{ needs.stamp.outputs.version }} (#${{ needs.stamp.outputs.code }})
            Android: ${{ needs.android.result == 'success' && 'kész (.apk)' || 'nem sikerült' }} · iPhone: ${{ needs.ios.result == 'success' && 'kész (.ipa)' || 'nem sikerült' }}

            Android: az appon belül („Frissítés”) vagy az .apk letöltésével telepíthető (ismeretlen forrás engedélyezése kell).
            iPhone: az .ipa aláírás nélküli; Sideloadly vagy AltStore segítségével, a saját Apple ID-ddel telepíthető.
          files: out/*
