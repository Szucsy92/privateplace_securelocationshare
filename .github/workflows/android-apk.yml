name: Android APK építése

# Indítás: GitHub → Actions → "Android APK építése" → Run workflow
on:
  workflow_dispatch:
    inputs:
      public_url:
        description: "A közzétett weboldal címe a meghívó linkekhez (üresen hagyva csak kód és QR-kód)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Az ubuntu-latest gépeken az Android SDK gyárilag telepítve van; csak a licenceket fogadjuk el.
      - name: Android SDK előkészítése
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi

      - name: Dátumos verzió
        run: |
          STAMP=$(TZ=Europe/Budapest date +%Y-%m-%d_%H%M)
          echo "BUILD_STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$(TZ=Europe/Budapest date +%Y.%m.%d-%H%M)" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Private Place $(TZ=Europe/Budapest date '+%Y.%m.%d. %H:%M') (#${{ github.run_number }})" >> "$GITHUB_ENV"

      - name: Függőségek
        run: bun install

      - name: Webes felület (statikus) építése
        env:
          VITE_PUBLIC_APP_URL: ${{ inputs.public_url }}
          # Opcionális saját továbbító (Settings → Secrets and variables → Actions)
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: VITE_APP_VERSION="$APP_VERSION_NAME" bun run build:app

      - name: Android projekt előkészítése (engedélyek, ikon, verzió)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/patch-android.mjs
          npx cap sync android

      - name: APK fordítása és aláírása
        working-directory: android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../out
          if [ -n "$KS_PASSWORD" ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/private-place.keystore" \
              -Pandroid.injected.signing.store.password="$KS_PASSWORD" \
              -Pandroid.injected.signing.key.alias=privateplace \
              -Pandroid.injected.signing.key.password="$KS_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "../out/private-place-${BUILD_STAMP}.apk"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::Nincs ANDROID_KEYSTORE_PASSWORD titok – teszt aláírással készül (frissítéskor újra kell telepíteni)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../out/private-place-${BUILD_STAMP}-teszt.apk"
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi

      - name: Aláírás ellenőrzése
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs out/*.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - uses: actions/upload-artifact@v4
        with:
          name: private-place-${{ env.BUILD_STAMP }}
          path: out/*.apk

      - name: Kiadás (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.BUILD_STAMP }}-${{ github.run_number }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            Verzió: ${{ env.APP_VERSION_NAME }} (#${{ github.run_number }})
            Aláírás: ${{ env.SIGNED == 'yes' && 'Private Place saját kulcs – a korábbi aláírt verzió fölé telepíthető.' || 'teszt aláírás – a régi verziót előbb törölni kell.' }}

            Töltsd le a telefonodra az APK-t, és telepítsd. (Ismeretlen forrásból való telepítést engedélyezni kell.)
          files: out/*.apk
