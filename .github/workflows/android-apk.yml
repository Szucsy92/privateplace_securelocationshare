name: Android APK építése

# Indítás: GitHub → Actions → "Android APK építése" → Run workflow
on:
  workflow_dispatch:
    inputs:
      public_url:
        description: "A közzétett weboldal címe a meghívó linkekhez (üresen hagyva csak kód és QR-kód)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Az ubuntu-latest gépeken az Android SDK gyárilag telepítve van; csak a licenceket fogadjuk el.
      - name: Android SDK előkészítése
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi

      - name: Függőségek
        run: bun install

      - name: Webes felület (statikus) építése
        env:
          VITE_PUBLIC_APP_URL: ${{ inputs.public_url }}
          # Opcionális saját továbbító (Settings → Secrets and variables → Actions)
          VITE_TURN_URLS: ${{ secrets.TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: bun run build:app

      - name: Android projekt előkészítése
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Alkalmazásikon
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#121a2b' --iconBackgroundColorDark '#121a2b' --splashBackgroundColor '#121a2b' --splashBackgroundColorDark '#121a2b'

      - name: APK fordítása
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK átnevezése
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/private-place-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: private-place-apk-${{ github.run_number }}
          path: out/*.apk

      - name: Kiadás (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Private Place ${{ github.run_number }}
          body: "Töltsd le a telefonodra az APK-t, és telepítsd. (Ismeretlen forrásból való telepítést engedélyezni kell.)"
          files: out/*.apk
